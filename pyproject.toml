[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "no2-modeling"
version = "0.1.0"
description = "Estimate power-plant NOx emissions from TEMPO satellite imagery"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "cdsapi",
    "earthaccess",
    "eccodes>=2.48.0",
    "eccodeslib>=2.48.0.26",
    "geopandas",
    "gridstatus==0.36.0",
    "matplotlib",
    "netCDF4",
    "numpy>=1.26,<2",
    "pandas",
    "polars>=1.30",
    "pyarrow==25.0.1",
    "pycanopy==0.3.4",
    "pyproj",
    "python-dotenv",
    "requests",
    "scikit-learn",
    "scipy",
    "seaborn",
    "shapely",
    "timezonefinder>=8.2.0",
    "torch==2.3.1",
]

[dependency-groups]
dev = ["ruff>=0.12"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["config", "prerequisites"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["collection*", "eda*", "modeling*", "preprocessing*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = {index = "pytorch-cu118"}

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
